<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Helpdesk</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Sistema de Helpdesk</h1>

<form action="/abrir" method="POST">

    <label>Solicitante</label><br>
    <input type="text" name="solicitante" required><br><br>

    <label>Equipamento</label><br>
    <input type="text" name="equipamento" required><br><br>

    <label>Descrição da Falha</label><br>

    <textarea name="descricao" rows="5" cols="50" required></textarea>

    <br><br>

    <button type="submit">
        Abrir Chamado
    </button>

</form>

<br>

<a href="/chamados">
Ver Chamados
</a>

</body>
</html>
